[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heimdall-browser-migrate"
version = "0.1.0"
description = "Migrate bookmarks, history, and passwords from any Chromium-based browser to any Firefox-based browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marvin Colcol" }]
keywords = ["browser", "migration", "chromium", "firefox", "zen", "comet", "bookmarks", "history"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
passwords = ["cryptography>=42"]

[project.scripts]
heimdall = "heimdall.cli:main"

[project.urls]
Homepage = "https://github.com/fiehrfly/heimdall"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]
